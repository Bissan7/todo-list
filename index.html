<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <h1>My To-Do List</h1>

        <form id="taskForm" class="input-section">
            <label for="taskInput" class="visually-hidden">New task</label>
            <input type="text" id="taskInput" placeholder="What do you need to do?" autocomplete="off" required>
            <button type="submit" id="addBtn">Add</button>
        </form>

        <div class="progress" id="progress" role="progressbar" aria-label="Tasks completed"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyState" class="empty-state">No tasks yet. Add your first one above.</p>

        <div class="task-info" aria-live="polite">
            <span>Total: <strong id="totalTasks">0</strong></span>
            <span>Completed: <strong id="completedTasks">0</strong></span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
